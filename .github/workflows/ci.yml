name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so that fuzzing runs longer and new toolchain or zizmor findings
  # show up between pull requests.
  schedule:
    - cron: "49 13 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in the Makefile

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

      - name: Test with race detector
        run: make test-race

  fuzz:
    runs-on: ubuntu-latest
    # 14 targets: about 6 minutes at 15s each, about 45 at 3m each.
    timeout-minutes: 60
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz every target for ${{ env.FUZZTIME }}
        run: make test-fuzz

      # A failing input is written to testdata/fuzz/<FuzzTarget>/; keep it, so
      # that it can be reproduced and committed as a regression seed.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # actionlint runs with go run, at the version pinned in the Makefile.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: actionlint and zizmor
        run: make lint-actions
        env:
          # Lets zizmor run its online audits (e.g. known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
