name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # goreleaser creates the GitHub release and uploads its assets
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # goreleaser publishes through the GitHub API with GITHUB_TOKEN; no
          # step pushes with git.
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # A release is built without restoring a cache that other workflows
          # could have written (cache poisoning).
          cache: false

      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
